# fail2ban filter: scanners probing LNbits for paths that are not ours.
#
# Reads LNbits' own log (<data folder>/logs/lnbits.log), whose request lines
# look like
#
#   2026-11-15 02:46:39.24 | INFO | 43.157.105.119:0 - "GET /api/.env HTTP/1.1" 404
#
# and are the ONLY line that carries the client address. The matching
# `| ERROR | lnbits.exceptions:error_handler_404 | 404: /api/.env ...` line has
# no address and is deliberately not matched: under load the two interleave, so
# an ERROR line cannot be paired with the INFO line that follows it.
#
# WHAT IT MATCHES, AND WHY IT IS NOT "ANY 404". A 404 is normal traffic here:
# the clients' pending-label flush asks about coins a scan has not found yet
# and is answered 404 by design, and a stale cached client calls routes that
# have since moved. Banning on 404 volume would ban those users and leave the
# scanners alone. So this matches a request for a PATH that no legitimate
# client has any reason to ask for -- dotfiles, GraphQL, PHP admin panels,
# archive and backup names, directory traversal -- answered 400..405.
#
# Every pattern below is a thing a scanner asks for and WhiSPa never does
# (checked against both repositories). To add one, add a line to `failregex`
# and a sample to tests/test_fail2ban_filter.py; the test keeps legitimate
# paths from ever matching.
#
# `%` is doubled throughout: fail2ban reads this through ConfigParser, where a
# bare % starts an interpolation.

[Definition]

_pre = ^(?:\.\d+)?\s*\| INFO\s*\| <ADDR>:\d+ - "[A-Z]+ \S*?
_post = \S*? HTTP/\d(?:\.\d)?" 40[0-5]\s*$

# Dotfiles and VCS/secret stores, under any prefix: /.env, /api/v1/.env.local,
# /.git/config, /.aws/credentials, ...
failregex = %(_pre)s/\.(?:env|git|svn|hg|aws|ssh|docker|npmrc|htaccess|htpasswd|ds_store|bash_history|vscode|idea)\b%(_post)s
            # GraphQL and its IDEs. LNbits has no GraphQL endpoint.
            %(_pre)s/(?:graphql|graphiql|gql)(?=[/?\s"])%(_post)s
            # Endpoints of other products that were asked of this instance.
            %(_pre)s/(?:api/v\d+/)?(?:auto_login|validate/code)\b%(_post)s
            # PHP and the CMS/admin panels that run on it.
            %(_pre)s\.php\d?(?=[/?\s"])%(_post)s
            %(_pre)s/(?:wp-(?:admin|login|content|includes|json)|xmlrpc|phpmyadmin|pma|adminer|phpunit|vendor/composer|eval-stdin)\b%(_post)s
            # Appliance, Java and CGI scanners.
            %(_pre)s/(?:cgi-bin|boaform|hnap1|actuator|jenkins|manager/html|solr|console|server-status|_ignition|owa|ecp|remote/login|\+cscoe\+)(?=[/?\s"])%(_post)s
            # Backups, dumps and archives asked for by name.
            %(_pre)s\.(?:sql|bak|old|orig|swp|tgz|tar|gz|zip|7z|rar)(?=[?\s"])%(_post)s
            # Directory traversal, plain and percent-encoded.
            %(_pre)s(?:\.\./|\.\.%%2f|%%2e%%2e|%%252e)%(_post)s

ignoreregex =

# The timestamp is local time with a fractional part (".24"). The date pattern
# stops at the seconds, so what is left of the line STARTS with that fraction,
# which is why `_pre` tolerates it: without that nothing matches at all.
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
